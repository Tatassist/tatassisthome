name: Import Linda coverup landing page

on:
  push:
    branches:
      - lindagcoverups-deploy
    paths:
      - '.github/lindagcoverups-import-trigger.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SOURCE_BUNDLE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-6d88-81fd-8c6d-74eb7590056b/raw?se=2026-08-21T01%3A28%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=55c8ff30-e123-5eef-869d-e7dc15958703&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T22%3A09%3A06Z&ske=2026-08-21T22%3A09%3A06Z&sks=b&skv=2026-02-06&sig=DqFgDlwIpKqtpe5Y9wiZvlClBe7hFmx%2BF1QXC5mojGI%3D'
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: lindagcoverups-deploy
          fetch-depth: 0

      - name: Download and install the approved source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lindagcoverups-source
          mkdir -p /tmp/lindagcoverups-source
          curl --fail --location --silent --show-error "$SOURCE_BUNDLE_URL" --output /tmp/lindagcoverups-source.zip
          unzip -q /tmp/lindagcoverups-source.zip -d /tmp/lindagcoverups-source

          mkdir -p public/lindagcoverups src/pages src/styles src/layouts
          cp -R /tmp/lindagcoverups-source/public/images/. public/lindagcoverups/
          cp /tmp/lindagcoverups-source/src/pages/lindagcoverups.astro src/pages/lindagcoverups.astro
          cp /tmp/lindagcoverups-source/src/styles/lindagcoverups.css src/styles/lindagcoverups.css
          cp /tmp/lindagcoverups-source/src/layouts/LindaCoverupLayout.astro src/layouts/LindaCoverupLayout.astro

          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/lindagcoverups.astro')
          page_text = page.read_text()
          page_text = page_text.replace("import Layout from '../layouts/Layout.astro';", "import Layout from '../layouts/LindaCoverupLayout.astro';")
          page_text = page_text.replace('/images/', '/lindagcoverups/')
          page.write_text(page_text)

          layout = Path('src/layouts/LindaCoverupLayout.astro')
          layout_text = layout.read_text()
          layout_text = layout_text.replace("import '../styles/global.css';", "import '../styles/lindagcoverups.css';")
          layout_text = layout_text.replace("import '../styles/mobile-fixes.css';\n", '')
          layout.write_text(layout_text)

          css = Path('src/styles/lindagcoverups.css')
          css_text = css.read_text()
          css_text += "\n\n@media (max-width: 600px) {\n\t.process-heading h2 {\n\t\tfont-size: clamp(2.5rem, 10vw, 4rem);\n\t}\n}\n"
          css.write_text(css_text)
          PY

      - name: Commit imported landing page to the deployment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tatassist Deployment Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/lindagcoverups.astro src/styles/lindagcoverups.css src/layouts/LindaCoverupLayout.astro public/lindagcoverups
          git commit -m 'Add Linda G coverup landing page at /lindagcoverups'
          git push origin HEAD:lindagcoverups-deploy

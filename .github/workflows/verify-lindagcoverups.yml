name: Verify Linda coverup landing page

on:
  push:
    branches:
      - lindagcoverups-deploy
    paths:
      - '.github/lindagcoverups-build-trigger.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: lindagcoverups-deploy
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify generated route and assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/lindagcoverups/index.html
          grep -q "Your old tattoo" dist/lindagcoverups/index.html
          test "$(find dist/lindagcoverups -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')" -eq 17
          if grep -q '/images/' dist/lindagcoverups/index.html; then
            echo 'Found an unscoped /images/ asset path in the generated route.' >&2
            exit 1
          fi

      - name: Record successful verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          {
            echo 'Linda coverup landing verification: passed'
            echo 'Route: /lindagcoverups'
            echo 'Build command: npm ci && npm run build'
            echo 'Generated HTML: dist/lindagcoverups/index.html'
            echo 'Scoped JPEG assets verified: 17'
            echo "Verified source commit: $(git rev-parse HEAD)"
            echo "Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > qa/lindagcoverups-build.txt
          git config user.name 'Tatassist Deployment Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qa/lindagcoverups-build.txt
          git commit -m 'Record Linda coverup landing build verification'
          git push origin HEAD:lindagcoverups-deploy

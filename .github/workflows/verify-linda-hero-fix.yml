name: Verify Linda hero and qualification fix

on:
  push:
    branches:
      - fix-linda-hero-qualification

permissions:
  contents: read

jobs:
  visual-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Astro preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/linda-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4321/lindagcoverups > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/linda-preview.log
          exit 1

      - name: Capture and assert desktop and mobile
        run: |
          mkdir -p qa-artifacts
          cat > /tmp/verify-linda.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const results = [];
          let failed = false;

          for (const viewport of [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
          ]) {
            const page = await browser.newPage({ viewport });
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto('http://127.0.0.1:4321/lindagcoverups', { waitUntil: 'networkidle' });
            await page.waitForFunction(() => [...document.images].every((image) => image.complete));

            const checks = await page.evaluate(() => {
              const heroImage = document.querySelector('.hero-art img');
              const heroArt = document.querySelector('.hero-art');
              const primaryCta = document.querySelector('.hero-actions .button-primary');
              const pageText = document.body.innerText;
              const imageRect = heroImage?.getBoundingClientRect();
              const artStyle = heroArt ? getComputedStyle(heroArt) : null;
              return {
                heroImageLoaded: Boolean(heroImage && heroImage.naturalWidth > 0),
                heroImageVisibleInFirstViewport: Boolean(
                  imageRect && imageRect.bottom > 0 && imageRect.top < window.innerHeight
                ),
                heroImageTop: imageRect?.top ?? null,
                heroImageBottom: imageRect?.bottom ?? null,
                heroArtOpacity: artStyle?.opacity ?? null,
                primaryCta: primaryCta?.textContent?.replace(/\s+/g, ' ').trim() ?? '',
                hasOldConsultCta: /request a consult|request a coverup consultation/i.test(pageText),
                hasQualificationLanguage: /consultations are offered only to projects linda selects/i.test(pageText),
                hasInvitationLanguage: /consultations by invitation/i.test(pageText),
                documentWidth: document.documentElement.scrollWidth,
                viewportWidth: window.innerWidth,
              };
            });

            const assertions = {
              heroImageLoaded: checks.heroImageLoaded,
              heroImageVisibleInFirstViewport: checks.heroImageVisibleInFirstViewport,
              heroNeverHiddenByReveal: checks.heroArtOpacity === '1',
              qualificationCta: checks.primaryCta === 'See if your project qualifies',
              oldConsultFramingRemoved: checks.hasOldConsultCta === false,
              qualificationLanguagePresent: checks.hasQualificationLanguage,
              invitationLanguagePresent: checks.hasInvitationLanguage,
              noHorizontalOverflow: checks.documentWidth <= checks.viewportWidth + 2,
              noPageErrors: errors.length === 0,
            };

            if (Object.values(assertions).some((value) => value !== true)) failed = true;

            await page.screenshot({
              path: `qa-artifacts/${viewport.name}-first-viewport.png`,
              fullPage: false,
            });
            await page.screenshot({
              path: `qa-artifacts/${viewport.name}-full-page.jpg`,
              fullPage: true,
              type: 'jpeg',
              quality: 86,
            });

            results.push({ viewport, checks, assertions, errors });
            await page.close();
          }

          await browser.close();
          await writeFile('qa-artifacts/report.json', JSON.stringify({ failed, results }, null, 2));
          console.log(JSON.stringify({ failed, results }, null, 2));
          if (failed) process.exit(1);
          EOF
          node /tmp/verify-linda.mjs

      - name: Upload visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linda-hero-qualification-qa
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 7

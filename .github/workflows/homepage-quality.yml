name: Homepage quality

on:
  push:
    branches: [homepage/artist-first-overhaul]
  pull_request:
    paths:
      - 'src/pages/index.astro'
      - 'src/styles/homepage.css'
      - 'src/layouts/FunnelLayout.astro'
      - 'src/components/BrandLogo.astro'
      - 'src/data/booking-funnel/**'
      - 'scripts/check-homepage.mjs'
      - '.github/workflows/homepage-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser test tooling without changing the project lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check responsive layouts and funnel entry
        run: node scripts/check-homepage.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-evidence
          path: homepage-check/
          retention-days: 7
          if-no-files-found: warn

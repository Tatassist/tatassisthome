<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="612" height="792" viewBox="0 0 612 792">
<path transform="matrix(1,0,0,-1,0,792)" d="M0 0H612V792H0Z" fill="#151515" fill-rule="evenodd"/>
<text fill="#f5f2eb" transform="matrix(1 0 0 1 0 792)" font-size="9" font-family="Helvetica,Arial,sans-serif" font-weight="bold"><tspan y="-752" x="48">JOKER INK / TATASSIST</tspan></text>
<path transform="matrix(1,0,0,-1,0,792)" stroke-width="1.7" fill="none" stroke="#b63325" d="M48 738H564"/>
<text fill="#b8b4ad" transform="matrix(1 0 0 1 0 792)" font-size="8" font-family="Helvetica,Arial,sans-serif"><tspan y="-30" x="48">TATASSIST.COM</tspan><tspan y="-30" x="539.536">01 / 04</tspan></text>
<text fill="#f5f2eb" transform="matrix(1 0 0 1 48 244)" font-size="38" font-family="Helvetica,Arial,sans-serif" font-weight="bold"><tspan y="-88" x="0">HOW I 10X'D</tspan><tspan y="-46" x="0">MY DEPOSITS</tspan><tspan y="-4" x="0">IN ONE MONTH</tspan></text>
<text fill="#f5f2eb" transform="matrix(1 0 0 1 48 320)" font-size="16" font-family="Helvetica,Arial,sans-serif" font-weight="bold"><tspan y="-26" x="0">I didn't get more talented. I didn't get more famous. I stopped letting</tspan><tspan y="-5" x="0">good clients slip through my fingers.</tspan></text>
<text fill="#f5f2eb" transform="matrix(1 0 0 1 48 397)" font-size="11.3" font-family="Helvetica,Arial,sans-serif"><tspan y="-39.7" x="0">One month. Same portfolio, same prices, same city. My deposits went up 10x, because I finally</tspan><tspan y="-22.7" x="0">admitted the problem wasn't my art. It was everything that happened </tspan></text>
<text fill="#f5f2eb" transform="matrix(1 0 0 1 48 397)" font-size="11.3" font-family="Helvetica,Arial,sans-serif" font-style="italic"><tspan y="-22.7" x="345.09077">after</tspan></text>
<text fill="#f5f2eb" transform="matrix(1 0 0 1 48 397)" font-size="11.3" font-family="Helvetica,Arial,sans-serif"><tspan y="-22.7" x="367.70207"> someone said "I love your</tspan><tspan y="-5.7" x="0">work."</tspan></text>
<text fill="#f5f2eb" transform="matrix(1 0 0 1 48 449)" font-size="11.3" font-family="Helvetica,Arial,sans-serif"><tspan y="-22.7" x="0">If you're reading this hoping for a magic sentence that makes people book, close the tab. This isn't that.</tspan><tspan y="-5.7" x="0">This is about why you're losing people you already have, and why you keep blaming the wrong thing.</tspan></text>
</svg>
